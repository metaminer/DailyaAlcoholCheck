<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>음주 통계</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- 헤더 -->
  <header class="bg-white shadow-sm sticky top-0 z-20">
    <div class="max-w-lg mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-lg font-bold text-indigo-600">🍶 음주 기록</h1>
      <nav class="flex gap-1">
        <a href="index.html" class="px-3 py-1.5 text-sm text-gray-500 hover:bg-gray-100 rounded-lg transition">달력</a>
        <a href="stats.html" class="px-3 py-1.5 text-sm font-semibold bg-indigo-50 text-indigo-600 rounded-lg">통계</a>
      </nav>
    </div>
  </header>

  <main class="max-w-lg mx-auto px-4 py-5 space-y-4">

    <!-- 로딩 상태 -->
    <div id="loadingState" class="text-center py-12 text-gray-400 text-sm">데이터 불러오는 중...</div>

    <!-- 콘텐츠 (로딩 후 표시) -->
    <div id="content" class="hidden space-y-4">

      <!-- 요약 카드 4개 -->
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-white rounded-2xl shadow-sm p-4">
          <p class="text-xs text-gray-400 mb-1">이번 달 음주일</p>
          <div class="flex items-end gap-1">
            <span id="thisMonthDays" class="text-3xl font-bold text-indigo-600">0</span>
            <span class="text-sm text-gray-400 mb-0.5">일</span>
          </div>
        </div>
        <div class="bg-white rounded-2xl shadow-sm p-4">
          <p class="text-xs text-gray-400 mb-1">이번 달 총 음주량</p>
          <div class="flex items-end gap-1">
            <span id="thisMonthGlasses" class="text-3xl font-bold text-amber-500">0</span>
            <span class="text-sm text-gray-400 mb-0.5">잔</span>
          </div>
        </div>
        <div class="bg-white rounded-2xl shadow-sm p-4">
          <p class="text-xs text-gray-400 mb-1">이번 달 절주율</p>
          <div class="flex items-end gap-1">
            <span id="soberRate" class="text-3xl font-bold text-green-500">0</span>
            <span class="text-sm text-gray-400 mb-0.5">%</span>
          </div>
        </div>
        <div class="bg-white rounded-2xl shadow-sm p-4">
          <p class="text-xs text-gray-400 mb-1">가장 많이 마신 주종</p>
          <div class="flex items-end gap-1">
            <span id="favDrink" class="text-2xl font-bold text-purple-600">-</span>
          </div>
          <p class="text-xs text-gray-300 mt-0.5">이번 달 기준</p>
        </div>
      </div>

      <!-- 월별 음주일 추이 -->
      <div class="bg-white rounded-2xl shadow-sm p-5">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-sm font-semibold text-gray-700">월별 음주일 추이</h3>
          <span class="text-xs text-gray-400">최근 6개월</span>
        </div>
        <div class="relative" style="height: 180px;">
          <canvas id="monthlyChart"></canvas>
        </div>
      </div>

      <!-- 주종 분포 -->
      <div class="bg-white rounded-2xl shadow-sm p-5">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-sm font-semibold text-gray-700">주종 분포</h3>
          <span class="text-xs text-gray-400">최근 3개월</span>
        </div>
        <div id="noTypeData" class="hidden text-center py-6 text-gray-300 text-sm">기록 없음</div>
        <div id="typeChartArea" class="flex items-center gap-5">
          <div class="flex-none" style="width:140px; height:140px; position:relative;">
            <canvas id="typeChart"></canvas>
          </div>
          <div id="typeLegend" class="flex-1 space-y-2 text-sm"></div>
        </div>
      </div>

      <!-- 최근 기록 목록 -->
      <div class="bg-white rounded-2xl shadow-sm p-5">
        <h3 class="text-sm font-semibold text-gray-700 mb-3">최근 기록</h3>
        <div id="recentList"></div>
      </div>

    </div>
  </main>

  <script>
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const DRINK_COLORS = {
      '소주': '#6366f1',
      '맥주': '#f59e0b',
      '와인': '#ec4899',
      '막걸리': '#10b981',
      '양주': '#8b5cf6',
      '기타': '#94a3b8',
    };
    const EMOJIS = { '소주':'🍶','맥주':'🍺','와인':'🍷','막걸리':'🍵','양주':'🥃','기타':'🫙' };
    const DAY_NAMES = ['일','월','화','수','목','금','토'];

    async function loadStats() {
      const today = new Date();
      const sixMonthsAgo = new Date(today.getFullYear(), today.getMonth() - 5, 1);
      const startStr = sixMonthsAgo.toISOString().split('T')[0];

      const { data, error } = await sb
        .from('alcohol_records')
        .select('*')
        .gte('date', startStr)
        .order('date', { ascending: false });

      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('content').classList.remove('hidden');

      if (error) {
        document.getElementById('content').innerHTML = `<p class="text-center text-red-400 text-sm py-8">데이터 로드 실패: ${error.message}</p>`;
        return;
      }

      const records = data || [];
      renderSummary(records, today);
      renderMonthlyChart(records, today);
      renderTypeChart(records, today);
      renderRecentList(records);
    }

    function renderSummary(records, today) {
      const monthStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
      const thisMonth = records.filter(r => r.date.startsWith(monthStr));
      const daysInMonth = new Date(today.getFullYear(), today.getMonth()+1, 0).getDate();

      document.getElementById('thisMonthDays').textContent = thisMonth.length;
      document.getElementById('thisMonthGlasses').textContent = thisMonth.reduce((s,r) => s + (r.glasses||0), 0);

      const elapsedDays = Math.min(today.getDate(), daysInMonth);
      const soberRate = elapsedDays > 0 ? Math.round((elapsedDays - thisMonth.length) / elapsedDays * 100) : 100;
      document.getElementById('soberRate').textContent = soberRate;

      const typeCounts = {};
      thisMonth.forEach(r => { typeCounts[r.drink_type] = (typeCounts[r.drink_type]||0) + 1; });
      const fav = Object.entries(typeCounts).sort((a,b) => b[1]-a[1])[0];
      document.getElementById('favDrink').textContent = fav ? (EMOJIS[fav[0]] + ' ' + fav[0]) : '-';
    }

    function renderMonthlyChart(records, today) {
      const labels = [];
      const counts = [];

      for (let i = 5; i >= 0; i--) {
        const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
        const ms = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
        labels.push(`${d.getMonth()+1}월`);
        counts.push(records.filter(r => r.date.startsWith(ms)).length);
      }

      new Chart(document.getElementById('monthlyChart'), {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            data: counts,
            backgroundColor: counts.map((_, i) => i === 5 ? 'rgba(99,102,241,0.85)' : 'rgba(99,102,241,0.35)'),
            borderRadius: 8,
            borderSkipped: false,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: {
            callbacks: { label: ctx => ` ${ctx.raw}일` }
          }},
          scales: {
            y: {
              beginAtZero: true,
              ticks: { stepSize: 1, color: '#9ca3af', font: { size: 11 } },
              grid: { color: 'rgba(0,0,0,0.04)' },
              border: { display: false }
            },
            x: {
              ticks: { color: '#9ca3af', font: { size: 11 } },
              grid: { display: false },
              border: { display: false }
            }
          }
        }
      });
    }

    function renderTypeChart(records, today) {
      const threeMonthsAgo = new Date(today.getFullYear(), today.getMonth() - 2, 1);
      const startStr = threeMonthsAgo.toISOString().split('T')[0];
      const recent = records.filter(r => r.date >= startStr);

      if (recent.length === 0) {
        document.getElementById('typeChartArea').classList.add('hidden');
        document.getElementById('noTypeData').classList.remove('hidden');
        return;
      }

      const typeCounts = {};
      recent.forEach(r => { typeCounts[r.drink_type] = (typeCounts[r.drink_type]||0) + 1; });
      const sorted = Object.entries(typeCounts).sort((a,b) => b[1]-a[1]);
      const types = sorted.map(([t]) => t);
      const counts = sorted.map(([,c]) => c);
      const colors = types.map(t => DRINK_COLORS[t] || '#94a3b8');
      const total = counts.reduce((a,b) => a+b, 0);

      new Chart(document.getElementById('typeChart'), {
        type: 'doughnut',
        data: {
          labels: types,
          datasets: [{ data: counts, backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }]
        },
        options: {
          responsive: false,
          cutout: '65%',
          plugins: { legend: { display: false }, tooltip: {
            callbacks: { label: ctx => ` ${ctx.raw}회 (${Math.round(ctx.raw/total*100)}%)` }
          }}
        }
      });

      document.getElementById('typeLegend').innerHTML = types.map((t, i) => `
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full flex-none" style="background:${colors[i]}"></span>
            <span class="text-gray-700">${EMOJIS[t] || ''} ${t}</span>
          </div>
          <span class="text-gray-400 text-xs">${Math.round(counts[i]/total*100)}%</span>
        </div>
      `).join('');
    }

    function renderRecentList(records) {
      const list = document.getElementById('recentList');
      const recent = records.slice(0, 12);

      if (recent.length === 0) {
        list.innerHTML = '<p class="text-sm text-gray-300 text-center py-4">기록이 없습니다.</p>';
        return;
      }

      list.innerHTML = recent.map(r => {
        const [y,m,d] = r.date.split('-');
        const dow = new Date(r.date + 'T00:00:00').getDay();
        const glasses = r.glasses || 0;
        const dotCls = glasses >= 6 ? 'bg-red-400' : glasses >= 3 ? 'bg-orange-400' : 'bg-amber-400';

        return `
          <div class="flex items-center gap-3 py-2.5 border-b border-gray-50 last:border-0">
            <div class="text-xs text-gray-400 w-16 flex-none text-right">${parseInt(m)}/${parseInt(d)} ${DAY_NAMES[dow]}</div>
            <span class="w-2 h-2 rounded-full ${dotCls} flex-none"></span>
            <div class="flex items-center gap-1.5 flex-1 min-w-0">
              <span class="text-sm font-medium text-gray-700">${EMOJIS[r.drink_type]||''} ${r.drink_type}</span>
              <span class="text-sm text-gray-400">${r.glasses}잔</span>
            </div>
            ${r.memo ? `<span class="text-xs text-gray-300 truncate max-w-20">${r.memo}</span>` : ''}
          </div>`;
      }).join('');
    }

    loadStats();
  </script>
</body>
</html>
