<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlcoholCalendar</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%BB%3C/text%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    body { background: #0a0c18; }
    .card { background: #12142a; border: 1px solid rgba(255,255,255,0.06); }
  </style>
</head>
<body class="min-h-screen text-white">

  <main class="max-w-lg mx-auto px-4 py-6 space-y-4">

    <!-- 헤더 -->
    <header class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-[#7c6cf7] to-[#4f7cf7] flex items-center justify-center text-2xl shadow-lg shadow-indigo-900/40">
          📊
        </div>
        <div>
          <h1 class="text-xl font-bold leading-tight">통계</h1>
          <p class="text-sm text-[#8b93ac] leading-tight">나의 음주 패턴</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a href="index.html" class="w-11 h-11 rounded-full card flex items-center justify-center hover:bg-white/5 transition">
          <svg class="w-5 h-5 text-[#8b93ac]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
        </a>
        <button id="logoutBtn" class="w-11 h-11 rounded-full card flex items-center justify-center hover:bg-white/5 transition" title="로그아웃">
          <svg class="w-5 h-5 text-[#8b93ac]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 로딩 -->
    <div id="loadingState" class="text-center py-12 text-[#8b93ac] text-sm">데이터 불러오는 중...</div>

    <!-- 콘텐츠 -->
    <div id="content" class="hidden space-y-4">

      <!-- 요약 카드 3개 -->
      <div class="grid grid-cols-3 gap-3">
        <div class="card rounded-2xl py-4 px-3 text-center">
          <div class="text-xs text-[#8b93ac] mb-1">이번 달 음주일</div>
          <div><span id="thisMonthDays" class="text-2xl font-bold text-[#fb7185]">0</span><span class="text-sm text-[#8b93ac]">일</span></div>
        </div>
        <div class="card rounded-2xl py-4 px-3 text-center">
          <div class="text-xs text-[#8b93ac] mb-1">총 음주량</div>
          <div><span id="thisMonthGlasses" class="text-2xl font-bold text-[#fbbf24]">0</span><span class="text-sm text-[#8b93ac]">캔</span></div>
        </div>
        <div class="card rounded-2xl py-4 px-3 text-center">
          <div class="text-xs text-[#8b93ac] mb-1">음주율</div>
          <div><span id="soberRate" class="text-2xl font-bold text-[#fb7185]">0</span><span class="text-sm text-[#8b93ac]">%</span></div>
        </div>
      </div>

      <!-- 월별 추이 차트 -->
      <div class="card rounded-3xl p-5">
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-sm font-semibold">월별 음주일 추이</h3>
          <span class="text-xs text-[#8b93ac]">최근 6개월</span>
        </div>
        <div class="relative" style="height: 180px;">
          <canvas id="monthlyChart"></canvas>
        </div>
      </div>

      <!-- 최근 기록 -->
      <div class="card rounded-3xl p-5">
        <h3 class="text-sm font-semibold mb-3">최근 기록</h3>
        <div id="recentList"></div>
      </div>

    </div>
  </main>

  <script>
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    sb.auth.getSession().then(({ data: { session } }) => {
      if (!session) window.location.href = 'login.html';
    });

    const DAY_NAMES = ['일','월','화','수','목','금','토'];

    async function loadStats() {
      const today = new Date();
      const sixMonthsAgo = new Date(today.getFullYear(), today.getMonth() - 5, 1);
      const startStr = sixMonthsAgo.toISOString().split('T')[0];

      const { data, error } = await sb
        .from('alcohol_records')
        .select('*')
        .gte('date', startStr)
        .order('date', { ascending: false });

      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('content').classList.remove('hidden');

      if (error) {
        document.getElementById('content').innerHTML = `<p class="text-center text-[#fb7185] text-sm py-8">데이터 로드 실패: ${error.message}</p>`;
        return;
      }

      const records = data || [];
      renderSummary(records, today);
      renderMonthlyChart(records, today);
      renderRecentList(records);
    }

    function renderSummary(records, today) {
      const monthStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
      const thisMonth = records.filter(r => r.date.startsWith(monthStr));
      const daysInMonth = new Date(today.getFullYear(), today.getMonth()+1, 0).getDate();

      document.getElementById('thisMonthDays').textContent = thisMonth.length;
      document.getElementById('thisMonthGlasses').textContent = thisMonth.reduce((s,r) => s + (r.glasses||0), 0);

      const elapsedDays = Math.min(today.getDate(), daysInMonth);
      const drinkRate = elapsedDays > 0 ? Math.round(thisMonth.length / elapsedDays * 100) : 0;
      document.getElementById('soberRate').textContent = drinkRate;
    }

    function renderMonthlyChart(records, today) {
      const labels = [];
      const counts = [];

      for (let i = 5; i >= 0; i--) {
        const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
        const ms = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
        labels.push(`${d.getMonth()+1}월`);
        counts.push(records.filter(r => r.date.startsWith(ms)).length);
      }

      new Chart(document.getElementById('monthlyChart'), {
        type: 'bar',
        data: {
          labels,
          datasets: [{
            data: counts,
            backgroundColor: counts.map((_, i) => i === 5 ? 'rgba(124,108,247,0.85)' : 'rgba(124,108,247,0.3)'),
            borderRadius: 8,
            borderSkipped: false,
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: {
            callbacks: { label: ctx => ` ${ctx.raw}일` }
          }},
          scales: {
            y: {
              beginAtZero: true,
              ticks: { stepSize: 1, color: '#8b93ac', font: { size: 11 } },
              grid: { color: 'rgba(255,255,255,0.04)' },
              border: { display: false }
            },
            x: {
              ticks: { color: '#8b93ac', font: { size: 11 } },
              grid: { display: false },
              border: { display: false }
            }
          }
        }
      });
    }

    function renderRecentList(records) {
      const list = document.getElementById('recentList');
      const recent = records.slice(0, 12);

      if (recent.length === 0) {
        list.innerHTML = '<p class="text-sm text-[#8b93ac] text-center py-4">기록이 없습니다.</p>';
        return;
      }

      list.innerHTML = recent.map(r => {
        const [y,m,d] = r.date.split('-');
        const dow = new Date(r.date + 'T00:00:00').getDay();

        return `
          <div class="flex items-center gap-3 py-2.5 border-b border-white/5 last:border-0">
            <div class="text-xs text-[#8b93ac] w-16 flex-none text-right">${parseInt(m)}/${parseInt(d)} ${DAY_NAMES[dow]}</div>
            <span class="w-2 h-2 rounded-full bg-[#fb7185] flex-none"></span>
            <div class="flex-1 text-sm font-medium">${r.glasses}캔</div>
            ${r.memo ? `<span class="text-xs text-[#8b93ac] truncate max-w-24">${r.memo}</span>` : ''}
          </div>`;
      }).join('');
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await sb.auth.signOut();
      window.location.href = 'login.html';
    });

    loadStats();
  </script>
</body>
</html>
