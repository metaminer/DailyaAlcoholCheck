<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>음주달력</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background: #0a0c18; }
    .day-cell { min-height: 56px; }
    .modal-enter { animation: slideUp 0.25s ease-out; }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .card {
      background: #12142a;
      border: 1px solid rgba(255,255,255,0.06);
    }
  </style>
</head>
<body class="min-h-screen text-white">

  <main class="max-w-lg mx-auto px-4 py-6 space-y-4">

    <!-- 헤더 -->
    <header class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-[#7c6cf7] to-[#4f7cf7] flex items-center justify-center text-2xl shadow-lg shadow-indigo-900/40">
          📅
        </div>
        <div>
          <h1 class="text-xl font-bold leading-tight">음주달력</h1>
          <p class="text-sm text-[#8b93ac] leading-tight">오늘도 나를 기록해요</p>
        </div>
      </div>
      <a href="stats.html" class="w-11 h-11 rounded-full card flex items-center justify-center hover:bg-white/5 transition">
        <svg class="w-5 h-5 text-[#8b93ac]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/>
        </svg>
      </a>
    </header>

    <!-- 월 네비게이션 + 요약 -->
    <div class="card rounded-3xl px-5 py-5">
      <div class="flex items-center justify-between mb-4">
        <button id="prevBtn" class="w-10 h-10 flex items-center justify-center rounded-full bg-white/5 hover:bg-white/10 transition">
          <svg class="w-5 h-5 text-[#8b93ac]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <div class="text-center">
          <h2 id="monthLabel" class="text-xl font-bold"></h2>
          <button id="todayBtn" class="text-xs text-[#7c6cf7] hover:text-[#9d8ffb] mt-0.5 transition">오늘로 이동</button>
        </div>
        <button id="nextBtn" class="w-10 h-10 flex items-center justify-center rounded-full bg-white/5 hover:bg-white/10 transition">
          <svg class="w-5 h-5 text-[#8b93ac]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
          </svg>
        </button>
      </div>

      <div class="grid grid-cols-3 gap-3">
        <div class="bg-white/5 rounded-2xl py-3 text-center">
          <div class="text-xs text-[#8b93ac] mb-1">음주일</div>
          <div><span id="monthDrinkDays" class="text-2xl font-bold text-[#fb7185]">0</span><span class="text-sm text-[#8b93ac]">일</span></div>
        </div>
        <div class="bg-white/5 rounded-2xl py-3 text-center">
          <div class="text-xs text-[#8b93ac] mb-1">절주일</div>
          <div><span id="monthSoberDays" class="text-2xl font-bold text-[#34d399]">0</span><span class="text-sm text-[#8b93ac]">일</span></div>
        </div>
        <div class="bg-white/5 rounded-2xl py-3 text-center">
          <div class="text-xs text-[#8b93ac] mb-1">총 음주량</div>
          <div><span id="monthTotalGlasses" class="text-2xl font-bold text-[#fbbf24]">0</span><span class="text-sm text-[#8b93ac]">단위</span></div>
        </div>
      </div>
    </div>

    <!-- 달력 카드 -->
    <div class="card rounded-3xl overflow-hidden">
      <!-- 요일 헤더 -->
      <div class="grid grid-cols-7 pt-4">
        <div class="text-center text-sm font-semibold text-[#fb7185] py-2">일</div>
        <div class="text-center text-sm font-semibold text-[#8b93ac] py-2">월</div>
        <div class="text-center text-sm font-semibold text-[#8b93ac] py-2">화</div>
        <div class="text-center text-sm font-semibold text-[#8b93ac] py-2">수</div>
        <div class="text-center text-sm font-semibold text-[#8b93ac] py-2">목</div>
        <div class="text-center text-sm font-semibold text-[#8b93ac] py-2">금</div>
        <div class="text-center text-sm font-semibold text-[#60a5fa] py-2">토</div>
      </div>

      <!-- 달력 그리드 -->
      <div id="calendarGrid" class="grid grid-cols-7 px-2 pb-4"></div>
    </div>

    <!-- 범례 -->
    <div class="card rounded-2xl px-5 py-4 flex items-center justify-center gap-6 text-sm text-[#8b93ac]">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-[#fb7185] inline-block"></span>음주
      </div>
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-[#34d399] inline-block"></span>절주
      </div>
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-[#4b5169] inline-block"></span>미기록
      </div>
    </div>

  </main>

  <!-- 기록 모달 -->
  <div id="modal" class="fixed inset-0 bg-black/60 flex items-end sm:items-center justify-center z-50 hidden">
    <div class="modal-enter card rounded-t-3xl sm:rounded-3xl w-full sm:max-w-sm shadow-2xl text-white">

      <!-- 모달 헤더 -->
      <div class="flex items-center justify-between px-6 pt-6 pb-2">
        <div>
          <h3 id="modalTitle" class="text-lg font-bold"></h3>
          <p id="modalDay" class="text-xs text-[#8b93ac] mt-0.5"></p>
        </div>
        <button id="closeModal" class="w-8 h-8 flex items-center justify-center rounded-full bg-white/5 hover:bg-white/10 transition">
          <svg class="w-4 h-4 text-[#8b93ac]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <form id="recordForm" class="px-6 pb-8 pt-4 space-y-5">
        <input type="hidden" id="recordId">
        <input type="hidden" id="recordDate">

        <!-- 음주량 -->
        <div>
          <label class="block text-sm font-medium text-[#8b93ac] mb-2.5">음주량</label>
          <div class="flex items-center gap-3">
            <button type="button" id="minusBtn" class="w-10 h-10 flex items-center justify-center rounded-full bg-white/5 text-[#c3c8db] hover:bg-white/10 text-xl font-bold transition">−</button>
            <div class="flex-1 text-center">
              <span id="glassesDisplay" class="text-3xl font-bold">1</span>
              <span class="text-sm text-[#8b93ac] ml-1">잔</span>
            </div>
            <button type="button" id="plusBtn" class="w-10 h-10 flex items-center justify-center rounded-full bg-white/5 text-[#c3c8db] hover:bg-white/10 text-xl font-bold transition">+</button>
          </div>
          <input type="hidden" id="glasses" value="1">
        </div>

        <!-- 메모 -->
        <div>
          <label class="block text-sm font-medium text-[#8b93ac] mb-2.5">메모 <span class="text-[#5c6178] font-normal">(선택)</span></label>
          <textarea id="memo" rows="2" placeholder="어디서, 누구와 마셨는지..."
            class="w-full border border-white/10 bg-white/5 rounded-xl px-4 py-3 text-sm text-white placeholder-[#5c6178] focus:outline-none focus:ring-2 focus:ring-[#7c6cf7]/50 focus:bg-white/10 transition resize-none"></textarea>
        </div>

        <!-- 버튼 -->
        <div class="flex gap-2 pt-1">
          <button type="button" id="deleteBtn"
            class="px-4 py-3 text-sm text-[#fb7185] border border-[#fb7185]/30 rounded-xl hover:bg-[#fb7185]/10 transition hidden">
            삭제
          </button>
          <button type="submit"
            class="flex-1 py-3 text-sm font-semibold bg-gradient-to-br from-[#7c6cf7] to-[#4f7cf7] text-white rounded-xl hover:opacity-90 active:scale-95 transition">
            저장하기
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const today = new Date();
    const todayStr = formatDate(today);
    let currentYear = today.getFullYear();
    let currentMonth = today.getMonth();
    let recordsByDate = {};
    let glassesCount = 1;

    const DAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];
    const MONTH_NAMES = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

    function formatDate(d) {
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    async function loadMonth() {
      const y = currentYear;
      const m = String(currentMonth + 1).padStart(2, '0');
      const lastDay = new Date(y, currentMonth + 1, 0).getDate();

      const { data } = await sb
        .from('alcohol_records')
        .select('*')
        .gte('date', `${y}-${m}-01`)
        .lte('date', `${y}-${m}-${lastDay}`);

      recordsByDate = {};
      (data || []).forEach(r => { recordsByDate[r.date] = r; });
      renderCalendar();
      renderSummary();
    }

    function renderCalendar() {
      document.getElementById('monthLabel').textContent = `${currentYear}년 ${MONTH_NAMES[currentMonth]}`;

      const firstDay = new Date(currentYear, currentMonth, 1).getDay();
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      for (let i = 0; i < firstDay; i++) {
        grid.innerHTML += `<div class="day-cell"></div>`;
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const rec = recordsByDate[dateStr];
        const dow = (firstDay + d - 1) % 7;
        const isToday = dateStr === todayStr;
        const isFuture = dateStr > todayStr;
        const isSun = dow === 0;
        const isSat = dow === 6;

        const numColor = isSun ? 'text-[#fb7185]' : isSat ? 'text-[#60a5fa]' : 'text-white';
        const todayStyle = isToday ? 'ring-2 ring-[#7c6cf7] ring-offset-1 ring-offset-[#12142a] rounded-2xl' : '';

        let dot = '';
        if (rec) {
          dot = `<span class="w-2 h-2 rounded-full bg-[#fb7185] inline-block"></span>`;
        } else if (!isFuture) {
          dot = `<span class="w-2 h-2 rounded-full bg-[#34d399] inline-block"></span>`;
        }

        grid.innerHTML += `
          <div class="day-cell flex flex-col items-center justify-start pt-2 pb-1 px-1 cursor-pointer rounded-2xl transition hover:bg-white/5 ${todayStyle}"
               onclick="openModal('${dateStr}')">
            <span class="text-sm ${numColor} ${isToday ? 'font-bold' : 'font-medium'} leading-none">${d}</span>
            <div class="mt-2 h-2 flex items-center justify-center">${dot}</div>
          </div>`;
      }
    }

    function renderSummary() {
      const recs = Object.values(recordsByDate);
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const isCurrentMonth = currentYear === today.getFullYear() && currentMonth === today.getMonth();
      const elapsedDays = isCurrentMonth ? today.getDate() : daysInMonth;

      document.getElementById('monthDrinkDays').textContent = recs.length;
      document.getElementById('monthTotalGlasses').textContent = recs.reduce((s, r) => s + r.glasses, 0);
      document.getElementById('monthSoberDays').textContent = Math.max(elapsedDays - recs.length, 0);
    }

    function openModal(dateStr) {
      const rec = recordsByDate[dateStr];
      const [y, m, d] = dateStr.split('-');
      const dow = new Date(dateStr).getDay();

      document.getElementById('modalTitle').textContent = `${parseInt(m)}월 ${parseInt(d)}일 기록`;
      document.getElementById('modalDay').textContent = DAY_NAMES[dow] + '요일';
      document.getElementById('recordDate').value = dateStr;
      document.getElementById('recordId').value = rec?.id || '';
      document.getElementById('memo').value = rec?.memo || '';

      glassesCount = rec?.glasses || 1;
      document.getElementById('glasses').value = glassesCount;
      document.getElementById('glassesDisplay').textContent = glassesCount;

      document.getElementById('deleteBtn').classList.toggle('hidden', !rec);
      document.getElementById('modal').classList.remove('hidden');
    }

    // 잔 수 증감
    document.getElementById('plusBtn').addEventListener('click', () => {
      if (glassesCount < 30) glassesCount++;
      document.getElementById('glasses').value = glassesCount;
      document.getElementById('glassesDisplay').textContent = glassesCount;
    });
    document.getElementById('minusBtn').addEventListener('click', () => {
      if (glassesCount > 1) glassesCount--;
      document.getElementById('glasses').value = glassesCount;
      document.getElementById('glassesDisplay').textContent = glassesCount;
    });

    // 저장
    document.getElementById('recordForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('recordId').value;
      const date = document.getElementById('recordDate').value;
      const glasses = parseInt(document.getElementById('glasses').value);
      const memo = document.getElementById('memo').value.trim();

      const payload = { date, glasses, memo, updated_at: new Date().toISOString() };
      let error;

      if (id) {
        ({ error } = await sb.from('alcohol_records').update(payload).eq('id', id));
      } else {
        ({ error } = await sb.from('alcohol_records').insert(payload));
      }

      if (error) { alert('저장 실패: ' + error.message); return; }
      closeModal();
      await loadMonth();
    });

    // 삭제
    document.getElementById('deleteBtn').addEventListener('click', async () => {
      if (!confirm('이 기록을 삭제할까요?')) return;
      const id = document.getElementById('recordId').value;
      const { error } = await sb.from('alcohol_records').delete().eq('id', id);
      if (error) { alert('삭제 실패: ' + error.message); return; }
      closeModal();
      await loadMonth();
    });

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    document.getElementById('closeModal').addEventListener('click', closeModal);
    document.getElementById('modal').addEventListener('click', e => {
      if (e.target === document.getElementById('modal')) closeModal();
    });

    // 월 이동
    document.getElementById('prevBtn').addEventListener('click', () => {
      if (currentMonth === 0) { currentMonth = 11; currentYear--; }
      else currentMonth--;
      loadMonth();
    });
    document.getElementById('nextBtn').addEventListener('click', () => {
      if (currentMonth === 11) { currentMonth = 0; currentYear++; }
      else currentMonth++;
      loadMonth();
    });
    document.getElementById('todayBtn').addEventListener('click', () => {
      currentYear = today.getFullYear();
      currentMonth = today.getMonth();
      loadMonth();
    });

    loadMonth();
  </script>
</body>
</html>
