<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlcoholCalendar</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%BB%3C/text%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background: #0a0c18; }
    .card { background: #12142a; border: 1px solid rgba(255,255,255,0.06); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 text-white">

  <div class="w-full max-w-sm">

    <!-- 앱 아이콘 + 타이틀 -->
    <div class="text-center mb-8">
      <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-[#7c6cf7] to-[#4f7cf7] flex items-center justify-center text-3xl shadow-lg shadow-indigo-900/40 mx-auto mb-4">
        📅
      </div>
      <h1 class="text-2xl font-bold">음주달력</h1>
      <p class="text-sm text-[#8b93ac] mt-1">로그인하여 기록을 시작하세요</p>
    </div>

    <!-- 로그인 폼 -->
    <div class="card rounded-3xl p-6">
      <form id="loginForm" class="space-y-4">

        <div>
          <label class="block text-sm font-medium text-[#8b93ac] mb-2">이메일</label>
          <input type="email" id="email" required placeholder="your@email.com"
            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-[#5c6178] focus:outline-none focus:ring-2 focus:ring-[#7c6cf7]/50 focus:bg-white/10 transition">
        </div>

        <div>
          <label class="block text-sm font-medium text-[#8b93ac] mb-2">비밀번호</label>
          <input type="password" id="password" required placeholder="••••••••"
            class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-[#5c6178] focus:outline-none focus:ring-2 focus:ring-[#7c6cf7]/50 focus:bg-white/10 transition">
        </div>

        <p id="errorMsg" class="text-xs text-[#fb7185] hidden"></p>

        <button type="submit" id="submitBtn"
          class="w-full py-3 text-sm font-semibold bg-gradient-to-br from-[#7c6cf7] to-[#4f7cf7] text-white rounded-xl hover:opacity-90 active:scale-95 transition mt-2">
          로그인
        </button>

      </form>
    </div>

  </div>

  <script>
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 이미 로그인되어 있으면 바로 이동
    sb.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = 'index.html';
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      const submitBtn = document.getElementById('submitBtn');

      submitBtn.textContent = '로그인 중...';
      submitBtn.disabled = true;
      errorMsg.classList.add('hidden');

      const { error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        errorMsg.textContent = '이메일 또는 비밀번호가 올바르지 않습니다.';
        errorMsg.classList.remove('hidden');
        submitBtn.textContent = '로그인';
        submitBtn.disabled = false;
        return;
      }

      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
